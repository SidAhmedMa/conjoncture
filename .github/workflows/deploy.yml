# Construit le site et le publie sur GitHub Pages à chaque poussée sur main.
#
# Déploiement de RELECTURE par défaut : TCR_NOINDEX demande aux moteurs de
# recherche de ne pas indexer le site, et l'URL est celle de GitHub Pages.
# Pour passer en production sur votre domaine, supprimez le bloc « env » de
# l'étape de construction : site.json reprend alors la main.
name: Déployer le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deux modes, choisis automatiquement :
      #   • fichier CNAME présent  → domaine personnalisé, publication à la racine
      #   • sinon                  → page de projet, sous-répertoire /<dépôt>/
      - name: Construire le site
        env:
          TCR_NOINDEX: "1"
        run: |
          if [ -f CNAME ]; then
            domain=$(head -1 CNAME | tr -d '[:space:]')
            export TCR_URL="https://${domain}"
            echo "Domaine personnalisé — publication vers ${TCR_URL}/"
          else
            owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
            export TCR_URL="https://${owner}.github.io"
            export TCR_BASE="${GITHUB_REPOSITORY#*/}"
            echo "Page de projet — publication vers ${TCR_URL}/${TCR_BASE}/"
          fi
          python3 build.py

      # GitHub Pages doit être activé une fois pour le dépôt, en mode
      # « GitHub Actions » (Settings → Pages). Le jeton du workflow n'a pas
      # le droit de créer le site lui-même.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
