<section class="notfound">
  <div class="wrap wrap--narrow">
    <p class="eyebrow">Erreur 404</p>
    <h1 class="notfound__title">Cette page est introuvable</h1>
    <p class="notfound__body">Le lien est peut-être obsolète, ou l'article a été déplacé. Reprenez par l'accueil ou explorez les rubriques.</p>
    <div class="notfound__actions">
      <a class="btn btn--solid" href="{{ base }}/">Retour à l'accueil {{ icon_arrow }}</a>
      <a class="btn btn--ghost" href="{{ base }}/archives/">Parcourir les archives</a>
    </div>
    <div class="notfound__rubs">{{ chips }}</div>
  </div>
</section>
